version: 2
linters:
  default: standard
  enable:
    - exhaustive
    - exhaustruct
  settings:
    exhaustruct:
      allow-empty: true
      include:
        - '.*github.com/acdifran/go-tools.*'
  exclusions:
    rules:
      - linters: ['errcheck']
        source: "^\\s*defer\\s+"

formatters:
  enable:
    - gofumpt
